name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Testes nativos (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Instalar ferramentas
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Compilar e rodar (sem llama.cpp)
        working-directory: native-tests
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
          ./build/girassol_native_tests
      - name: Baixar llama.cpp e modelo GGUF de teste
        run: |
          set -e
          curl -fsSL -o /tmp/llama.tgz https://github.com/ggml-org/llama.cpp/archive/refs/tags/v1.0.0.tar.gz
          echo "3f5f750e36326aea4d65c7623e7d597a33e395d65f4d76e5e0532171f252532b  /tmp/llama.tgz" | sha256sum -c -
          mkdir -p /tmp/src && tar -xzf /tmp/llama.tgz -C /tmp/src
          curl -fsSL -o /tmp/stories260K.gguf https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
          echo "270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  /tmp/stories260K.gguf" | sha256sum -c -
      - name: Compilar e rodar (com llama.cpp + GBNF)
        working-directory: native-tests
        env:
          GIRASSOL_TEST_GGUF: /tmp/stories260K.gguf
          ASAN_OPTIONS: detect_leaks=1
        run: |
          cmake -S . -B build-llama -G Ninja -DGIRASSOL_LLAMA_DIR=/tmp/src/llama.cpp-1.0.0
          cmake --build build-llama
          ./build-llama/girassol_native_tests

  android:
    name: Testes, lint e APKs
    runs-on: ubuntu-latest
    needs: native-tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK 35, NDK e CMake (SDK pré-instalado no runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache de dependências nativas (llama.cpp, Filament matc)
        uses: actions/cache@v4
        with:
          path: build/third_party
          key: third-party-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Assinatura de release (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.GIRASSOL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/girassol.jks"
            echo "GIRASSOL_KEYSTORE_PATH=$RUNNER_TEMP/girassol.jks" >> "$GITHUB_ENV"
            echo "Assinando release com a keystore dos secrets."
          else
            echo "Secret GIRASSOL_KEYSTORE_BASE64 ausente: release será assinado com a chave de debug."
          fi
      - name: Build e testes
        env:
          GIRASSOL_KEYSTORE_PASSWORD: ${{ secrets.GIRASSOL_KEYSTORE_PASSWORD }}
          GIRASSOL_KEY_ALIAS: ${{ secrets.GIRASSOL_KEY_ALIAS }}
          GIRASSOL_KEY_PASSWORD: ${{ secrets.GIRASSOL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:compileFilamentMaterials :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            core/build/reports/tests
            app/build/reports
      - name: APKs
        uses: actions/upload-artifact@v4
        with:
          name: girassol-apks
          path: app/build/outputs/apk/**/*.apk

  instrumentation:
    name: Testes de instrumentação (emulador)
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar SDK 35, NDK e CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache de dependências nativas
        uses: actions/cache@v4
        with:
          path: build/third_party
          key: third-party-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Pré-compilar APKs de teste (x86_64)
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -Pgirassol.abis=x86_64
      - name: Rodar androidTest (abas Mundo e Sistema)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c || true
            adb logcat -v threadtime > logcat-emulador.txt 2>&1 & LP=$!; ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pgirassol.abis=x86_64; rc=$?; sleep 2; kill $LP 2>/dev/null; exit $rc
      - name: Relatórios de instrumentação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-instrumentacao
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            logcat-emulador.txt
