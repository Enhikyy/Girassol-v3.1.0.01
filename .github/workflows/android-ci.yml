name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Testes nativos (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Compilar e rodar
        working-directory: native-tests
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
          ./build/girassol_native_tests

  android:
    name: Testes, lint e APKs
    runs-on: ubuntu-latest
    needs: native-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar NDK e CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assinatura de release (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.GIRASSOL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/girassol.jks"
            echo "GIRASSOL_KEYSTORE_PATH=$RUNNER_TEMP/girassol.jks" >> "$GITHUB_ENV"
            echo "Assinando release com a keystore dos secrets."
          else
            echo "Secret GIRASSOL_KEYSTORE_BASE64 ausente: release será assinado com a chave de debug."
          fi
      - name: Build e testes
        env:
          GIRASSOL_KEYSTORE_PASSWORD: ${{ secrets.GIRASSOL_KEYSTORE_PASSWORD }}
          GIRASSOL_KEY_ALIAS: ${{ secrets.GIRASSOL_KEY_ALIAS }}
          GIRASSOL_KEY_PASSWORD: ${{ secrets.GIRASSOL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :core:test testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            core/build/reports/tests
            app/build/reports
      - name: APKs
        uses: actions/upload-artifact@v4
        with:
          name: girassol-apks
          path: app/build/outputs/apk/**/*.apk
